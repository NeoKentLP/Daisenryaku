<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>指挥官创建 v2 - UI原型</title>
<link rel="stylesheet" href="../shared.css">
<style>
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;justify-content:center;align-items:center;z-index:50}

.panel{width:780px;background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-panel);box-shadow:var(--shadow-panel);overflow:hidden}

.panel-header{padding:10px 14px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center}
.panel-header .h-left{display:flex;align-items:center;gap:8px}
.panel-header .h-title{color:var(--color-highlight);font-size:var(--fs-title);font-weight:bold}
.panel-header .h-step{color:var(--text-dim);font-size:var(--fs-small)}
.panel-header .h-close{color:var(--text-dim);font-size:14px;cursor:pointer;padding:0 4px}
.panel-header .h-close:hover{color:var(--text-highlight)}

.panel-desc{padding:8px 14px;font-size:var(--fs-small);color:var(--text-secondary);border-bottom:1px solid var(--border-light)}

/* 横排4列 */
.cmd-row{display:flex;gap:8px;padding:10px 14px}
.cmd-card{flex:1;display:flex;gap:6px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:var(--radius-box);padding:8px;position:relative;min-height:120px}

/* 稀有度边框 + 背景微光 */
.cmd-card.r0{border-color:rgba(255,255,255,0.06)}
.cmd-card.r1{border-color:rgba(255,255,255,0.12)}
.cmd-card.r2{border-color:rgba(100,170,255,0.2);background:linear-gradient(135deg,rgba(100,170,255,0.02),transparent)}
.cmd-card.r3{border-color:rgba(255,170,102,0.35);background:linear-gradient(135deg,rgba(255,170,102,0.04),transparent);box-shadow:inset 0 0 20px rgba(255,170,102,0.04)}

/* ===== 左模块: 身份区(竖排) ===== */
.identity-col{display:flex;flex-direction:column;align-items:center;gap:3px;width:52px;flex-shrink:0}

.avatar{width:40px;height:50px;background:rgba(255,255,255,0.03);border:1px solid var(--border-light);border-radius:var(--radius-card);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-dim)}
.cmd-card.r3 .avatar{border-color:rgba(255,170,102,0.2)}

.rarity-tag{font-size:7px;padding:1px 5px;border-radius:3px;white-space:nowrap;line-height:1.4}
.rarity-tag.r3{background:rgba(255,170,102,0.15);color:#fc6}
.rarity-tag.r2{background:rgba(100,170,255,0.1);color:var(--color-highlight)}
.rarity-tag.r1{background:rgba(255,255,255,0.04);color:var(--text-secondary)}
.rarity-tag.r0{background:rgba(255,255,255,0.03);color:var(--text-dim)}

.lv-text{font-size:7px;color:var(--text-dim)}

.name-text{font-size:9px;color:var(--text-highlight);font-weight:bold;text-align:center;word-break:break-all;line-height:1.2;cursor:text;width:100%}
.name-text:focus{outline:none;color:var(--color-highlight)}

/* 描述按钮(小i) */
.desc-btn{width:14px;height:14px;border-radius:50%;border:1px solid var(--border-light);background:rgba(255,255,255,0.02);color:var(--text-dim);font-size:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:auto}
.desc-btn:hover{background:rgba(100,170,255,0.08);border-color:var(--color-highlight);color:var(--color-highlight)}

/* ===== 右模块: 技能区(竖排) ===== */
.skill-col{flex:1;display:flex;flex-direction:column;gap:2px;justify-content:center;min-width:0}

.skill-row{display:flex;align-items:center;gap:4px;padding:1px 0}
.skill-label{font-size:6px;color:var(--text-dim);width:12px;flex-shrink:0;text-align:right}

/* 技能图标 */
.skill-icons{display:flex;gap:3px;flex-wrap:wrap}
.skill-icon{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8px;cursor:pointer;transition:all 0.1s;position:relative}
.skill-icon:hover{transform:scale(1.15);z-index:2}
.skill-icon.bg{background:rgba(102,255,102,0.12);color:var(--color-bg);border:1px solid rgba(102,255,102,0.15)}
.skill-icon.talent{background:rgba(102,136,255,0.12);color:var(--color-talent);border:1px solid rgba(102,136,255,0.15)}
.skill-icon.quality{background:rgba(255,170,102,0.12);color:var(--color-quality);border:1px solid rgba(255,170,102,0.15)}
.skill-icon.empty{background:transparent;border:1px dashed rgba(255,255,255,0.04);color:var(--text-muted);cursor:default}
.skill-icon.empty:hover{transform:none}

/* 品质槽位标记 */
.quality-slots{font-size:6px;color:var(--text-dim);display:flex;align-items:center;gap:2px;margin-left:2px}

/* 主角标记 */
.prot-badge{position:absolute;top:-1px;left:-1px;font-size:6px;padding:2px 7px;border-radius:var(--radius-box) 0 var(--radius-card) 0;background:linear-gradient(135deg,rgba(255,170,102,0.15),rgba(255,200,100,0.1));border:1px solid rgba(255,170,102,0.2);color:var(--color-quality)}

/* 重掷 */
.reroll-btn{position:absolute;bottom:6px;right:6px;padding:1px 6px;border-radius:3px;font-size:6px;border:1px solid var(--border-light);background:rgba(255,255,255,0.03);color:var(--text-dim);cursor:pointer}
.reroll-btn:hover{background:rgba(100,170,255,0.08);color:var(--text-highlight);border-color:var(--color-highlight)}

/* 底部 */
.panel-footer{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-top:1px solid var(--border-light);background:rgba(255,255,255,0.02)}
.footer-left{font-size:var(--fs-small);color:var(--text-dim)}
.footer-left .hl{color:var(--color-highlight)}
.f-btn{padding:5px 14px;border-radius:var(--radius-card);font-size:var(--fs-small);cursor:pointer;border:1px solid;transition:all 0.1s}
.f-btn.confirm{background:rgba(68,170,136,0.08);border-color:rgba(68,170,136,0.2);color:var(--color-ally)}
.f-btn.confirm:hover{background:rgba(68,170,136,0.15)}
.f-btn.cancel{background:rgba(255,255,255,0.03);border-color:var(--border);color:var(--text-secondary)}
.f-btn.cancel:hover{background:rgba(255,255,255,0.06);color:var(--text-highlight)}

/* Tooltip (fixed) */
.stt{display:none;position:fixed;background:rgba(0,0,0,0.96);border:1px solid var(--border);border-radius:var(--radius-card);padding:5px 8px;z-index:99999;pointer-events:none;white-space:nowrap;line-height:1.4}
.stt .st-title{color:var(--text-highlight);font-size:9px;font-weight:bold;margin-bottom:2px}
.stt .st-type{font-size:7px;margin-bottom:2px}
.stt .st-type.bg{color:var(--color-bg)}
.stt .st-type.talent{color:var(--color-talent)}
.stt .st-type.quality{color:var(--color-quality)}
.stt .st-desc{color:var(--text-secondary);font-size:8px}
.stt .st-sep{border-top:1px solid var(--border-light);margin:3px 0}
</style>
</head>
<body>

<div class="overlay">
  <div class="panel">

    <div class="panel-header">
      <div class="h-left">
        <span class="h-title">创建指挥官</span>
        <span class="h-step">第2步/共2步</span>
      </div>
      <span class="h-close" onclick="alert('返回国家选择')">✕</span>
    </div>

    <div class="panel-desc">创建初始指挥官。主角固定英雄，其余按概率生成。可分别点击【↻】重掷，技能图标悬浮查看详情。</div>

    <!-- 4横排 -->
    <div class="cmd-row">

      <!-- 卡1: 主角 -->
      <div class="cmd-card r3" data-index="0">
        <span class="prot-badge">主角</span>
        <div class="identity-col">
          <div class="avatar">★</div>
          <span class="rarity-tag r3">英雄</span>
          <span class="lv-text">Lv1</span>
          <span class="name-text" contenteditable="true">曼施坦因</span>
          <span class="desc-btn" onmouseenter="showSTT(event,'指挥官描述','hero')" onmouseleave="hideSTT()">i</span>
        </div>
        <div class="skill-col" data-card="0">
          <div class="skill-row"><span class="skill-label">背景</span><div class="skill-icons"><span class="skill-icon bg sk-item" data-sid="bg_armor">⛭</span></div></div>
          <div class="skill-row"><span class="skill-label">天赋</span><div class="skill-icons"><span class="skill-icon talent sk-item" data-sid="tal_insight">◈</span></div></div>
          <div class="skill-row"><span class="skill-label">品质</span><div class="skill-icons">
            <span class="skill-icon quality sk-item" data-sid="q_penetrate">◆</span>
            <span class="skill-icon quality sk-item" data-sid="q_first">◆</span>
            <span class="skill-icon quality sk-item" data-sid="q_deadly">◆</span>
          </div></div>
        </div>
        <span class="reroll-btn" onclick="reroll(this)">↻</span>
      </div>

      <!-- 卡2: 老兵 -->
      <div class="cmd-card r2" data-index="1">
        <div class="identity-col">
          <div class="avatar">◆</div>
          <span class="rarity-tag r2">老兵</span>
          <span class="lv-text">Lv1</span>
          <span class="name-text" contenteditable="true">克鲁格</span>
          <span class="desc-btn" onmouseenter="showSTT(event,'指挥官描述','vet')" onmouseleave="hideSTT()">i</span>
        </div>
        <div class="skill-col" data-card="1">
          <div class="skill-row"><span class="skill-label">背景</span><div class="skill-icons"><span class="skill-icon bg sk-item" data-sid="bg_infantry">⚔</span></div></div>
          <div class="skill-row"><span class="skill-label">天赋</span><div class="skill-icons"><span class="skill-icon talent sk-item" data-sid="tal_tough">◈</span></div></div>
          <div class="skill-row"><span class="skill-label">品质</span><div class="skill-icons">
            <span class="skill-icon quality sk-item" data-sid="q_reactive">◆</span>
            <span class="skill-icon quality sk-item" data-sid="q_stable">◆</span>
          </div></div>
        </div>
        <span class="reroll-btn" onclick="reroll(this)">↻</span>
      </div>

      <!-- 卡3: 预备军官 -->
      <div class="cmd-card r1" data-index="2">
        <div class="identity-col">
          <div class="avatar">◇</div>
          <span class="rarity-tag r1">预备军官</span>
          <span class="lv-text">Lv1</span>
          <span class="name-text" contenteditable="true">迈尔</span>
          <span class="desc-btn" onmouseenter="showSTT(event,'指挥官描述','reserve')" onmouseleave="hideSTT()">i</span>
        </div>
        <div class="skill-col" data-card="2">
          <div class="skill-row"><span class="skill-label">背景</span><div class="skill-icons"><span class="skill-icon bg sk-item" data-sid="bg_artillery">◎</span></div></div>
          <div class="skill-row"><span class="skill-label">天赋</span><div class="skill-icons"><span class="skill-icon talent sk-item" data-sid="tal_diligent">◈</span></div></div>
          <div class="skill-row"><span class="skill-label">品质</span><div class="skill-icons">
            <span class="skill-icon quality sk-item" data-sid="q_ammo">◆</span>
            <span class="skill-icon empty"></span>
            <span class="skill-icon empty"></span>
          </div></div>
        </div>
        <span class="reroll-btn" onclick="reroll(this)">↻</span>
      </div>

      <!-- 卡4: 菜鸟 -->
      <div class="cmd-card r0" data-index="3">
        <div class="identity-col">
          <div class="avatar">○</div>
          <span class="rarity-tag r0">菜鸟</span>
          <span class="lv-text">Lv1</span>
          <span class="name-text" contenteditable="true">贝克尔</span>
          <span class="desc-btn" onmouseenter="showSTT(event,'指挥官描述','rookie')" onmouseleave="hideSTT()">i</span>
        </div>
        <div class="skill-col" data-card="3">
          <div class="skill-row"><span class="skill-label">背景</span><div class="skill-icons"><span class="skill-icon bg sk-item" data-sid="bg_recon">⌂</span></div></div>
          <div class="skill-row"><span class="skill-label">天赋</span><div class="skill-icons"><span class="skill-icon talent sk-item" data-sid="tal_cautious">◈</span></div></div>
          <div class="skill-row"><span class="skill-label">品质</span><div class="skill-icons">
            <span class="skill-icon empty"></span>
            <span class="skill-icon empty"></span>
            <span class="skill-icon empty"></span>
          </div><span class="quality-slots">0/0</span></div></div>
        </div>
        <span class="reroll-btn" onclick="reroll(this)">↻</span>
      </div>

    </div>

    <div class="panel-footer">
      <span class="footer-left">已选: <span class="hl">德国</span></span>
      <div style="display:flex;gap:6px">
        <div class="f-btn cancel" onclick="alert('返回国家选择')">返回</div>
        <div class="f-btn confirm" onclick="alert('进入第一关')">确认编成</div>
      </div>
    </div>

  </div>
</div>

<!-- 技能tooltip容器 -->
<div class="stt" id="stt"></div>

<script>
// === 技能详情数据 ===
var skillDB = {
  bg_armor:    {name:'装甲兵', type:'bg', desc:'指挥装甲部队时全技能生效'},
  bg_infantry: {name:'步兵指挥官', type:'bg', desc:'步兵部队士气恢复+2'},
  bg_artillery:{name:'炮术', type:'bg', desc:'间接火力命中+5%'},
  bg_recon:    {name:'侦察', type:'bg', desc:'所属部队视野+1'},
  tal_insight: {name:'洞察 Lv2', type:'talent', desc:'视野+2，可预判敌方移动路线'},
  tal_tough:   {name:'坚韧 Lv2', type:'talent', desc:'被命中后压制获得-20%'},
  tal_diligent:{name:'勤勉 Lv1', type:'talent', desc:'经验获取+15%'},
  tal_cautious:{name:'谨慎 Lv1', type:'talent', desc:'被命中率-5%'},
  q_penetrate: {name:'穿甲专精', type:'quality', desc:'PEN+1'},
  q_first:     {name:'先发制人', type:'quality', desc:'主动性+2'},
  q_deadly:    {name:'致命一击', type:'quality', desc:'暴击率+10%'},
  q_reactive:  {name:'快速响应', type:'quality', desc:'反应次数+1'},
  q_stable:    {name:'稳定射击', type:'quality', desc:'波动下限+5%'},
  q_ammo:      {name:'弹药管理', type:'quality', desc:'弹药上限+20%'}
}

var descDB = {
  hero:   '出身装甲兵世家，精通闪电战理论。指挥装甲部队时具备卓越的战场洞察力。',
  vet:    '从东线战场一路打拼过来的步兵指挥官，作风坚韧，深得士兵信赖。',
  reserve:'炮兵学院优等毕业生，理论扎实但实战经验尚浅。',
  rookie: '刚完成侦察兵训练的新兵，反应敏捷但缺乏战场经验。'
}

// === 技能图标悬浮tooltip ===
document.querySelectorAll('.sk-item').forEach(function(el){
  el.addEventListener('mouseenter',function(e){
    var sid = this.dataset.sid
    var sk = skillDB[sid]
    if(!sk) return
    var stt = document.getElementById('stt')
    var typeLabel = {bg:'背景技能',talent:'天赋技能',quality:'品质技能'}
    stt.innerHTML = '<div class="st-title">'+sk.name+'</div><div class="st-type '+sk.type+'">'+typeLabel[sk.type]+'</div><div class="st-sep"></div><div class="st-desc">'+sk.desc+'</div>'
    stt.style.display='block'
    var r = this.getBoundingClientRect()
    var tx = r.left + r.width/2 - stt.offsetWidth/2
    var ty = r.top - 4 - stt.offsetHeight
    if(tx<4) tx=4; if(tx+stt.offsetWidth>window.innerWidth-4) tx=window.innerWidth-4-stt.offsetWidth
    if(ty<4) ty=r.bottom+4
    stt.style.left=tx+'px'; stt.style.top=ty+'px'
  })
  el.addEventListener('mouseleave',function(){ document.getElementById('stt').style.display='none' })
})

// === 描述按钮tooltip ===
function showSTT(e, title, key){
  var stt = document.getElementById('stt')
  stt.innerHTML = '<div class="st-title">'+title+'</div><div class="st-desc">'+descDB[key]+'</div>'
  stt.style.display='block'
  var r = e.target.getBoundingClientRect()
  var tx = r.left + r.width/2 - stt.offsetWidth/2
  var ty = r.top - 4 - stt.offsetHeight
  if(tx<4) tx=4; if(tx+stt.offsetWidth>window.innerWidth-4) tx=window.innerWidth-4-stt.offsetWidth
  if(ty<4) ty=r.bottom+4
  stt.style.left=tx+'px'; stt.style.top=ty+'px'
}
function hideSTT(){ document.getElementById('stt').style.display='none' }

// === 重掷 ===
function reroll(btn){
  if(!confirm('重掷该指挥官？手动修改的名称将保留。')) return
  var card = btn.closest('.cmd-card')
  var isPro = !!card.querySelector('.prot-badge')
  var nameEl = card.querySelector('.name-text')
  if(!nameEl.dataset.edited){
    var names = ['古德里安','隆美尔','邓尼茨','巴尔克','莫德尔','凯塞林','保卢斯']
    nameEl.textContent = names[Math.floor(Math.random()*names.length)]
  }
  var ri = isPro ? 3 : Math.floor(Math.random()*4)
  card.className = 'cmd-card r'+ri
  card.querySelector('.rarity-tag').textContent = ['菜鸟','预备军官','老兵','英雄'][ri]
  card.querySelector('.rarity-tag').className = 'rarity-tag r'+ri

  // 随机化技能图标
  var bgs = ['bg_armor:⛭','bg_infantry:⚔','bg_artillery:◎','bg_recon:⌂','bg_engineer:⚒','bg_logistics:⟐']
  var tals = ['tal_insight:◈','tal_tough:◈','tal_diligent:◈','tal_cautious:◈','tal_valiant:◈','tal_leader:◈']
  var qs = ['q_penetrate:◆','q_first:◆','q_deadly:◆','q_reactive:◆','q_stable:◆','q_ammo:◆','q_strong:◆','q_hard:◆']
  var qCount = [0,1,2,3][ri]

  var skillCol = card.querySelector('.skill-col')
  var icons = skillCol.querySelectorAll('.skill-icons')
  // 背景
  var bgPick = bgs[Math.floor(Math.random()*bgs.length)]
  var bgParts = bgPick.split(':')
  icons[0].querySelector('.sk-item').dataset.sid = bgParts[0]
  icons[0].querySelector('.sk-item').textContent = bgParts[1]
  // 天赋
  var talPick = tals[Math.floor(Math.random()*tals.length)]
  var talParts = talPick.split(':')
  icons[1].querySelector('.sk-item').dataset.sid = talParts[0]
  icons[1].querySelector('.sk-item').textContent = talParts[1]
  // 品质
  var usedQ = []
  var qIcons = icons[2].querySelectorAll('.sk-item')
  for(var i=0;i<3;i++){
    if(i<qCount){
      var pick
      do{ pick = qs[Math.floor(Math.random()*qs.length)] } while(usedQ.includes(pick))
      usedQ.push(pick)
      var parts = pick.split(':')
      qIcons[i].dataset.sid = parts[0]
      qIcons[i].textContent = parts[1]
      qIcons[i].className = 'skill-icon quality sk-item'
    } else {
      qIcons[i].className = 'skill-icon empty'
      qIcons[i].dataset.sid = ''
      qIcons[i].textContent = ''
    }
  }
}

document.querySelectorAll('.name-text').forEach(function(el){
  el.addEventListener('input',function(){ this.dataset.edited = 'true' })
})
</script>
</body>
</html>
